name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run quality checks
        run: ./mvnw -B -ntp -DskipTests compile checkstyle:check spotbugs:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and coverage checks
        run: ./mvnw -B -ntp clean verify

      - name: Upload JaCoCo report
        if: ${{ always() && hashFiles('target/site/jacoco/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Surefire reports
        if: ${{ always() && hashFiles('target/surefire-reports/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Build for CodeQL analysis
        uses: github/codeql-action/autobuild@v4

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build-image:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - tests
      - codeql
      - dependency-review

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bolsa-valores:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        id: start-container
        run: >-
          docker run --rm --detach
          --name bolsa-valores-ci
          --env PORT=8080
          --publish 8080:8080
          bolsa-valores:ci

      - name: Check container health
        run: >-
          curl --silent --show-error --fail
          --retry 20 --retry-delay 2 --retry-connrefused
          http://localhost:8080/actuator/health
          | jq --exit-status '.status == "UP"'

      - name: Stop container
        if: ${{ always() && steps.start-container.outcome == 'success' }}
        run: docker stop bolsa-valores-ci
