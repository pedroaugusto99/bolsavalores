name: Bolsa Valores CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bolsa-valores-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RENDER_CLI_VERSION: '2.28.0'

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests, coverage and static analysis
        run: ./mvnw -B -ntp clean verify

  build:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag bolsa-valores:${{ github.sha }} .

      - name: Start container
        id: start-container
        run: >-
          docker run --detach
          --name bolsa-valores-ci
          --env PORT=8080
          --publish 8080:8080
          bolsa-valores:${{ github.sha }}

      - name: Check container health
        run: >-
          curl --fail --silent --show-error
          --retry 10
          --retry-delay 2
          --retry-connrefused
          --retry-all-errors
          http://127.0.0.1:8080/actuator/health
          | jq --exit-status '.status == "UP"'

      - name: Test NASDAQ integration
        run: >-
          curl --fail --silent --show-error
          --request POST
          --header "Content-Type: application/json"
          --data '{"movement":"UNCHANGED"}'
          http://127.0.0.1:8080/api/integracoes/nasdaq/eventos
          | jq --exit-status
          '.bolsa == "NASDAQ" and
          .variacao == "SEM_ALTERACAO" and
          (.clientesNotificados | length == 0)'

      - name: Remove test container
        if: ${{ always() && steps.start-container.outcome == 'success' }}
        run: docker rm --force bolsa-valores-ci

  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    environment: staging

    steps:
      - name: Install Render CLI
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip" \
            --output render-cli.zip
          unzip -q render-cli.zip
          sudo install "cli_v${RENDER_CLI_VERSION}" /usr/local/bin/render

      - name: Deploy current commit to staging
        env:
          CI: 'true'
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: >-
          render deploys create "${RENDER_SERVICE_ID}"
          --commit "${GITHUB_SHA}"
          --wait
          --confirm

      - name: Check staging health
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: >-
          curl --fail --silent --show-error
          --retry 10
          --retry-delay 5
          --retry-all-errors
          "${APP_BASE_URL%/}/actuator/health"
          | jq --exit-status '.status == "UP"'

  deploy-production:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    environment: production

    steps:
      - name: Install Render CLI
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip" \
            --output render-cli.zip
          unzip -q render-cli.zip
          sudo install "cli_v${RENDER_CLI_VERSION}" /usr/local/bin/render

      - name: Deploy current commit to production
        env:
          CI: 'true'
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: >-
          render deploys create "${RENDER_SERVICE_ID}"
          --commit "${GITHUB_SHA}"
          --wait
          --confirm

      - name: Check production health
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: >-
          curl --fail --silent --show-error
          --retry 10
          --retry-delay 5
          --retry-all-errors
          "${APP_BASE_URL%/}/actuator/health"
          | jq --exit-status '.status == "UP"'
